name: Deploy static UI preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'preview.css'
      - 'preview.js'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Prepare preview-only artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s preview.css
          test -s preview.js
          grep -q 'preview.css' index.html
          grep -q 'preview.js' index.html
          mkdir -p _site
          cp index.html preview.css preview.js _site/
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
