name: Resolve Composer Lock (PHP 8.2)

on:
  push:
    paths:
      - ".github/workflows/resolve-composer-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Validate current Composer files
        run: composer validate --no-check-publish

      - name: Resolve PHP 8.2-compatible dependencies
        run: >
          composer update
          symfony/clock
          symfony/css-selector
          symfony/event-dispatcher
          symfony/string
          symfony/translation
          --with-all-dependencies
          --no-interaction
          --prefer-dist
          --no-progress

      - name: Validate resolved lock file
        run: |
          composer validate --no-check-publish
          composer install --dry-run --no-interaction --prefer-dist --no-progress

      - name: Commit compatible lock file to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock is already up to date"
          else
            git commit -m "Fix Composer lock compatibility with PHP 8.2"
            git push origin HEAD:main
          fi
