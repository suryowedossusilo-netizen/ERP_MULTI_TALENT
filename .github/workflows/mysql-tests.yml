name: MySQL Compatibility Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-compatibility:
    name: MySQL 8.4 connection and Laravel configuration check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing-only-password
          MYSQL_DATABASE: erp_multi_talent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptesting-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_mysql, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Verify MySQL connection and server version (no schema changes)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_multi_talent_test
          DB_USERNAME: root
          DB_PASSWORD: testing-only-password
        run: |
          php -r '$pdo = new PDO("mysql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); echo "MySQL server version: ", $pdo->query("SELECT VERSION()")->fetchColumn(), PHP_EOL;'

      - name: Verify Laravel route registration with MySQL selected (no migrations)
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_multi_talent_test
          DB_USERNAME: root
          DB_PASSWORD: testing-only-password
        run: php artisan route:list --except-vendor

      # Feature tests use RefreshDatabase and would run migrations.
      # Do not run them until the owner separately approves a migration test plan.
