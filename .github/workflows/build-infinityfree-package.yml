name: Build InfinityFree deployment package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Prepare a safe htdocs-only layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy/infinityfree
          mkdir -p .deploy/infinityfree/htdocs/erp_app
          mkdir -p .deploy/infinityfree/htdocs/storage/app/public

          rsync -a ./ .deploy/infinityfree/htdocs/erp_app/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='public/' \
            --exclude='.env' \
            --exclude='.htaccess' \
            --exclude='DEPLOY_INFINITYFREE.md' \
            --exclude='.phpunit.cache/' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/lsp-*'

          rsync -a --exclude='index.php' --exclude='.htaccess' public/ .deploy/infinityfree/htdocs/

          cat > .deploy/infinityfree/htdocs/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $applicationPath = __DIR__ . '/erp_app';

          if (file_exists($maintenance = $applicationPath . '/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require $applicationPath . '/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once $applicationPath . '/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

          cat > .deploy/infinityfree/htdocs/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
              RewriteEngine On

              # Block all web requests to Laravel source, configuration, and .env.
              RewriteRule ^erp_app(?:/|$) - [F,L,NC]

              # Block executable scripts in public uploads.
              RewriteRule ^storage/.*\.(?:php[0-9]?|phtml|phar)(?:/|$) - [F,L,NC]

              # Let the physical public-storage path resolve without another rewrite.
              RewriteRule ^storage/app/public/ - [L]

              # Map Laravel's /storage/* URLs to htdocs/storage/app/public/*.
              RewriteRule ^storage/(.*)$ storage/app/public/$1 [L]

              # Keep existing public files as-is; send application routes to Laravel.
              RewriteCond %{REQUEST_FILENAME} -f [OR]
              RewriteCond %{REQUEST_FILENAME} -d
              RewriteRule ^ - [L]

              RewriteRule ^ index.php [L]
          </IfModule>
          HTACCESS

          cat > .deploy/infinityfree/htdocs/storage/index.html <<'HTML'
          <!doctype html><title>Not found</title>
          HTML

      - name: Install production dependencies without optimized classmaps
        run: composer --working-dir=.deploy/infinityfree/htdocs/erp_app install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Build Laravel package metadata
        working-directory: .deploy/infinityfree/htdocs/erp_app
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          PUBLIC_STORAGE_ROOT: '../storage/app/public'
        run: php artisan package:discover --ansi

      - name: Validate shared-hosting limits and writable folders
        shell: bash
        run: |
          set -euo pipefail
          app_dir=".deploy/infinityfree/htdocs/erp_app"
          large_php="$(find "$app_dir" -type f -name '*.php' -size +950k -print)"
          if [ -n "$large_php" ]; then
            echo "::error::PHP files close to the host's 1 MB limit were found:"
            printf '%s\n' "$large_php"
            exit 1
          fi
          mkdir -p "$app_dir/storage/framework/cache/data"
          mkdir -p "$app_dir/storage/framework/sessions"
          mkdir -p "$app_dir/storage/framework/views"
          mkdir -p "$app_dir/storage/logs"
          mkdir -p "$app_dir/storage/app/private"
          mkdir -p "$app_dir/storage/app/public"
          mkdir -p "$app_dir/bootstrap/cache"
          mkdir -p .deploy/infinityfree/htdocs/storage/app/public
          chmod -R u+rwX,go+rX "$app_dir/storage"
          chmod -R u+rwX,go+rX "$app_dir/bootstrap/cache"
          chmod -R u+rwX,go+rX .deploy/infinityfree/htdocs/storage

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: erp-multi-talent-infinityfree
          path: .deploy/infinityfree/htdocs/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
